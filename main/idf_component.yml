dependencies:
  idf: ">=6.2"
  # BSP（显示/触摸/音频/LVGL 适配）来自仓库 submodule。
  esp-mosaico-bsp:
    version: "*"
    override_path: "../../../submodule/esp-mosaico-bsp/components/esp-mosaico-bsp"
  # ESP-Iris 设备管理/OTA 传输（sdkconfig.defaults 的 CONFIG_ESP_IRIS_*）。
  esp_iris:
    version: "*"
    override_path: "../../../submodule/esp-mosaico-utils/ESP-Iris/components/esp_iris"
  # 与 BSP 显示适配器（esp_lvgl_adapter 0.6.2）匹配的 LVGL 版本。
  lvgl/lvgl: "==9.5.0"
  # BSP 在 CONFIG_BSP_DISPLAY_LVGL_ENABLE 时通过依赖 rules 引入适配器；这里显式
  # 声明同版本，保证组件管理器一定下载（rules 在早期解析阶段偶发不生效）。
  espressif/esp_lvgl_adapter: "0.6.2"
  # MP3 解码（esp_audio_simple_dec）与 AP 配网（esp-wifi-connect）用
  # components/ 里的本地副本，不再在此声明。
  # 发音缓存：SPI NAND 分层块设备 + LittleFS VFS（/nand）。
  # 与 little-prince / words_app 相同的依赖组合；esp_littlefs 的 CDN 源在
  # 本机 403，用仓库外的本地 clone override。
  espressif/spi_nand_flash: "^1.4.1"
  joltwallet/esp_littlefs:
    version: "*"
    override_path: "../../../../esp_littlefs"
